<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Puissance 4 — Multijoueur</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/ably@latest/ably.min.js"></script>
<style>
  :root { --red:#E8412A; --yellow:#F5C518; --blue-dark:#0D1B2A; --text:#F0EDE6; --text-muted:#7A95AD; --border:rgba(255,255,255,0.08); --card-bg:rgba(255,255,255,0.04); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'DM Sans',sans-serif; background:var(--blue-dark); color:var(--text); min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:1rem; }
  h1 { font-family:'Syne',sans-serif; font-weight:800; font-size:clamp(2rem,6vw,3.5rem); letter-spacing:-0.03em; text-align:center; margin-bottom:0.2rem; line-height:1; }
  h1 span { color:var(--yellow); }
  .tagline { color:var(--text-muted); font-size:14px; text-align:center; margin-bottom:2rem; }
  .screen { width:100%; max-width:420px; }
  .card { background:var(--card-bg); border:1px solid var(--border); border-radius:16px; padding:1.5rem; margin-bottom:1rem; }
  label { font-size:12px; font-weight:500; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.08em; display:block; margin-bottom:6px; }
  input[type=text] { width:100%; height:48px; background:rgba(255,255,255,0.06); border:1px solid var(--border); border-radius:10px; padding:0 14px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:15px; outline:none; margin-bottom:12px; display:block; }
  input[type=text]::placeholder { color:var(--text-muted); }
  .btn { display:block; width:100%; height:48px; border-radius:10px; border:none; font-family:'Syne',sans-serif; font-size:14px; font-weight:700; cursor:pointer; letter-spacing:0.04em; text-transform:uppercase; }
  .btn-primary { background:var(--yellow); color:#1A1200; margin-bottom:10px; }
  .btn-secondary { background:rgba(255,255,255,0.08); color:var(--text); border:1px solid var(--border); margin-top:8px; }
  .divider { display:flex; align-items:center; gap:10px; margin:16px 0; color:var(--text-muted); font-size:12px; }
  .divider::before,.divider::after { content:''; flex:1; height:1px; background:var(--border); }
  .room-code-display { font-family:'Syne',sans-serif; font-size:42px; font-weight:800; letter-spacing:8px; text-align:center; color:var(--yellow); padding:20px 0 10px; }
  .game-area { width:100%; max-width:480px; }
  .game-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .player-tag { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:500; padding:6px 12px; border-radius:20px; border:1px solid var(--border); background:var(--card-bg); transition:all 0.3s; }
  .player-tag.active-red { border-color:var(--red); background:rgba(232,65,42,0.12); }
  .player-tag.active-yellow { border-color:var(--yellow); background:rgba(245,197,24,0.12); }
  .player-dot { width:10px; height:10px; border-radius:50%; }
  .dot-red { background:var(--red); }
  .dot-yellow { background:var(--yellow); }
  .board-wrap { background:linear-gradient(145deg,#185FA5,#0C3D6E); border-radius:16px; padding:12px; margin-bottom:14px; }
  .col-hints { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:6px; }
  .col-hint { aspect-ratio:1; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .col-hint:hover { background:rgba(255,255,255,0.15); }
  .col-hint::after { content:'▼'; font-size:10px; color:rgba(255,255,255,0.4); }
  .col-hint.cant { cursor:default; }
  .col-hint.cant::after { opacity:0; }
  .board-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .cell { aspect-ratio:1; border-radius:50%; background:rgba(0,0,0,0.35); box-shadow:inset 0 3px 8px rgba(0,0,0,0.5); transition:background 0.15s; }
  .cell.red { background:var(--red); box-shadow:0 0 12px rgba(232,65,42,0.5); }
  .cell.yellow { background:var(--yellow); box-shadow:0 0 12px rgba(245,197,24,0.5); }
  .cell.win { outline:3px solid white; }
  .status-bar { text-align:center; font-family:'Syne',sans-serif; font-size:15px; font-weight:700; color:var(--text-muted); min-height:22px; margin-bottom:10px; }
  .status-bar.win-msg { color:var(--yellow); font-size:18px; }
  .btn-sm { height:44px; padding:0 16px; border-radius:10px; border:none; font-family:'Syne',sans-serif; font-size:12px; font-weight:700; cursor:pointer; letter-spacing:0.04em; text-transform:uppercase; }
  .bottom-actions { display:flex; gap:8px; }
  .btn-sm.outline { flex:1; background:transparent; color:var(--text-muted); border:1px solid var(--border); }
  .btn-sm.solid { flex:1; background:rgba(255,255,255,0.1); color:var(--text); border:1px solid var(--border); }
  .hidden { display:none !important; }
  .error-msg { color:#E8412A; font-size:13px; text-align:center; margin-top:8px; min-height:18px; }
  .pulse { animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  .spinner { display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,0.2); border-top-color:var(--text); border-radius:50%; animation:spin 0.7s linear infinite; vertical-align:middle; margin-right:6px; }
  @keyframes spin { to{transform:rotate(360deg)} }
</style>
</head>
<body>

<div id="screen-home" class="screen">
  <h1>PUIS<span>SANCE</span> 4</h1>
  <p class="tagline">Multijoueur en ligne — partagez un code</p>
  <div class="card">
    <label>Votre prénom</label>
    <input type="text" id="input-name" placeholder="Ex: Alice" maxlength="16" />
    <button class="btn btn-primary" onclick="createRoom()">Créer une partie</button>
    <div class="divider">ou rejoindre</div>
    <label>Code de la partie</label>
    <input type="text" id="input-code" placeholder="Ex: AB12" maxlength="4" style="text-transform:uppercase;letter-spacing:4px;font-family:'Syne',sans-serif;font-size:20px;text-align:center;" />
    <button class="btn btn-secondary" style="margin-top:0;" onclick="joinRoom()">Rejoindre</button>
    <div class="error-msg" id="home-error"></div>
  </div>
</div>

<div id="screen-waiting" class="screen hidden">
  <h1>EN ATTENTE</h1>
  <p class="tagline">Partagez ce code avec votre adversaire</p>
  <div class="card" style="text-align:center;">
    <div class="room-code-display" id="waiting-code">----</div>
    <p style="color:var(--text-muted);font-size:13px;margin-bottom:16px;">Votre adversaire entre ce code sur la même page</p>
    <div style="display:flex;align-items:center;justify-content:center;gap:8px;color:var(--text-muted);font-size:13px;" class="pulse">
      <span class="spinner"></span> En attente de connexion…
    </div>
  </div>
  <button class="btn btn-secondary" onclick="resetGame()">Annuler</button>
</div>

<div id="screen-game" class="game-area hidden">
  <div class="game-header">
    <div class="player-tag" id="tag-red"><span class="player-dot dot-red"></span><span id="name-red">Joueur 1</span></div>
    <div style="font-family:'Syne',sans-serif;font-size:12px;color:var(--text-muted);">VS</div>
    <div class="player-tag" id="tag-yellow"><span class="player-dot dot-yellow"></span><span id="name-yellow">Joueur 2</span></div>
  </div>
  <div class="board-wrap">
    <div class="col-hints" id="col-hints"></div>
    <div class="board-grid" id="board"></div>
  </div>
  <div class="status-bar" id="status-bar"></div>
  <div class="bottom-actions">
    <button class="btn-sm solid hidden" id="btn-restart" onclick="requestRestart()">↺ Rejouer</button>
    <button class="btn-sm outline" onclick="resetGame()">← Quitter</button>
  </div>
</div>

<script>
const COLS=7,ROWS=6;
const ABLY_KEY='BFwJKQ.gZEOaA:Tnoe2YWxICn58ffGK_yQed3FG87kLmz5HcBx9aoszKw';
let G={role:null,code:null,name:'',board:null,turn:'red',gameOver:false,winner:null,winCells:[],ably:null,channel:null,restartVote:{red:false,yellow:false}};

function emptyBoard(){return Array(ROWS).fill(null).map(()=>Array(COLS).fill(null));}
function randCode(){return Math.random().toString(36).substr(2,4).toUpperCase();}

function initAbly(code){
  if(G.ably)G.ably.close();
  G.ably=new Ably.Realtime({key:ABLY_KEY});
  G.channel=G.ably.channels.get('p4-'+code);
}

async function createRoom(){
  const name=document.getElementById('input-name').value.trim()||'Joueur 1';
  G.name=name; G.role='red';
  const code=randCode(); G.code=code;
  initAbly(code);
  // Écouter les événements
  G.channel.subscribe('join', msg=>{
    G.board=G.board||emptyBoard();
    const room={board:G.board,turn:'red',status:'playing',redName:G.name,yellowName:msg.data.name,gameOver:false,winner:null,winCells:[],restartVote:{red:false,yellow:false}};
    G.channel.publish('state', room);
    applyRoom(room);
    show('game');
  });
  G.channel.subscribe('state', msg=>{ applyRoom(msg.data); });
  G.channel.subscribe('restart_vote', msg=>{
    G.restartVote[msg.data.color]=true;
    if(G.restartVote.red&&G.restartVote.yellow){
      G.restartVote={red:false,yellow:false};
      const room={board:emptyBoard(),turn:'red',status:'playing',redName:document.getElementById('name-red').textContent,yellowName:document.getElementById('name-yellow').textContent,gameOver:false,winner:null,winCells:[],restartVote:{red:false,yellow:false}};
      G.channel.publish('state',room);
      applyRoom(room);
    }
  });
  G.board=emptyBoard();
  document.getElementById('waiting-code').textContent=code;
  show('waiting');
}

async function joinRoom(){
  const name=document.getElementById('input-name').value.trim()||'Joueur 2';
  const code=document.getElementById('input-code').value.trim().toUpperCase();
  if(code.length<4){showError('home-error','Code invalide (4 caractères)');return;}
  G.name=name; G.role='yellow'; G.code=code;
  initAbly(code);
  G.channel.subscribe('state', msg=>{ applyRoom(msg.data); });
  G.channel.subscribe('restart_vote', msg=>{
    G.restartVote[msg.data.color]=true;
    if(G.restartVote.red&&G.restartVote.yellow){
      G.restartVote={red:false,yellow:false};
    }
  });
  // Annoncer l'arrivée
  await G.channel.publish('join',{name});
  showError('home-error','');
  show('game');
  // Afficher un plateau vide en attendant l'état
  G.board=emptyBoard();
  G.turn='red'; G.gameOver=false; G.winner=null; G.winCells=[];
  document.getElementById('name-yellow').textContent=name;
  renderBoard();
  updateStatus({status:'waiting',gameOver:false,turn:'red'});
}

function show(s){['home','waiting','game'].forEach(id=>{const el=document.getElementById('screen-'+id);if(el)el.classList.toggle('hidden',id!==s);});}

function applyRoom(room){
  if(!room)return;
  G.board=room.board; G.turn=room.turn; G.gameOver=room.gameOver;
  G.winner=room.winner; G.winCells=room.winCells||[];
  if(room.restartVote)G.restartVote=room.restartVote;
  if(room.redName)document.getElementById('name-red').textContent=room.redName;
  if(room.yellowName)document.getElementById('name-yellow').textContent=room.yellowName;
  renderBoard(); updateTurnUI(); updateStatus(room);
}

function renderBoard(){
  const hints=document.getElementById('col-hints');
  const board=document.getElementById('board');
  if(!hints||!board||!G.board)return;
  const canPlay=!G.gameOver&&G.turn===G.role;
  hints.innerHTML='';
  for(let c=0;c<COLS;c++){
    const h=document.createElement('div');
    h.className='col-hint'+(canPlay?'':' cant');
    if(canPlay)h.onclick=()=>dropPiece(c);
    hints.appendChild(h);
  }
  board.innerHTML='';
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const cell=document.createElement('div');
      cell.className='cell';
      const v=G.board[r][c];
      if(v)cell.classList.add(v);
      if(G.winCells.some(([wr,wc])=>wr===r&&wc===c))cell.classList.add('win');
      board.appendChild(cell);
    }
  }
}

function updateTurnUI(){
  const tr=document.getElementById('tag-red');
  const ty=document.getElementById('tag-yellow');
  if(!tr||!ty)return;
  tr.className='player-tag'+(G.turn==='red'&&!G.gameOver?' active-red':'');
  ty.className='player-tag'+(G.turn==='yellow'&&!G.gameOver?' active-yellow':'');
}

function updateStatus(room){
  const el=document.getElementById('status-bar');
  const rb=document.getElementById('btn-restart');
  if(!el)return;
  if(!room.status||room.status==='waiting'){el.textContent='En attente du 2e joueur…';el.className='status-bar';return;}
  if(room.gameOver){
    if(room.winner){
      const wn=room.winner==='red'?document.getElementById('name-red').textContent:document.getElementById('name-yellow').textContent;
      el.textContent='🏆 '+wn+' remporte la partie !';
    }else{el.textContent='Match nul !';}
    el.className='status-bar win-msg';
    if(rb)rb.classList.remove('hidden');
  }else{
    const tn=G.turn==='red'?document.getElementById('name-red').textContent:document.getElementById('name-yellow').textContent;
    el.textContent=G.turn===G.role?'À vous de jouer !':'Au tour de '+tn+'…';
    el.className='status-bar';
    if(rb)rb.classList.add('hidden');
  }
}

function checkWin(board,color){
  const check=(cells)=>cells.every(([r,c])=>r>=0&&r<ROWS&&c>=0&&c<COLS&&board[r][c]===color);
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const sets=[[[r,c],[r,c+1],[r,c+2],[r,c+3]],[[r,c],[r+1,c],[r+2,c],[r+3,c]],[[r,c],[r+1,c+1],[r+2,c+2],[r+3,c+3]],[[r,c],[r+1,c-1],[r+2,c-2],[r+3,c-3]]];
      for(const s of sets){if(check(s))return s;}
    }
  }
  return null;
}
function isDraw(board){return board.every(row=>row.every(c=>c!==null));}

function dropPiece(col){
  if(G.gameOver||G.turn!==G.role)return;
  const board=G.board.map(r=>[...r]);
  let row=-1;
  for(let r=ROWS-1;r>=0;r--){if(!board[r][col]){row=r;break;}}
  if(row<0)return;
  board[row][col]=G.role;
  const winCells=checkWin(board,G.role);
  const draw=!winCells&&isDraw(board);
  const room={
    board,
    turn:winCells||draw?G.role:(G.role==='red'?'yellow':'red'),
    status:'playing',
    redName:document.getElementById('name-red').textContent,
    yellowName:document.getElementById('name-yellow').textContent,
    gameOver:!!(winCells||draw),
    winner:winCells?G.role:null,
    winCells:winCells||[],
    restartVote:{red:false,yellow:false}
  };
  G.channel.publish('state',room);
  applyRoom(room);
}

function requestRestart(){
  G.channel.publish('restart_vote',{color:G.role});
  G.restartVote[G.role]=true;
  if(G.restartVote.red&&G.restartVote.yellow){
    G.restartVote={red:false,yellow:false};
    const room={board:emptyBoard(),turn:'red',status:'playing',redName:document.getElementById('name-red').textContent,yellowName:document.getElementById('name-yellow').textContent,gameOver:false,winner:null,winCells:[],restartVote:{red:false,yellow:false}};
    G.channel.publish('state',room);
    applyRoom(room);
  }
}

function resetGame(){
  if(G.ably)G.ably.close();
  G={role:null,code:null,name:'',board:null,turn:'red',gameOver:false,winner:null,winCells:[],ably:null,channel:null,restartVote:{red:false,yellow:false}};
  document.getElementById('input-name').value='';
  document.getElementById('input-code').value='';
  showError('home-error','');
  show('home');
}

function showError(id,msg){const el=document.getElementById(id);if(el)el.textContent=msg;}
</script>
</body>
</html>
